# Opt-in persistent PTY composition for the PTY snapshot scenario. The base
# deployment already owns the shared sandbox provider and policy.
- insert:
    - id: pty
      name: '@hy/dsh-terminal'
    - id: terminal-bash
      name: '@hy/dsh-terminal-bash'
      config:
        pollIntervalMs: 10
        exactProbeAfterMs: 20
        idleSilenceMs: 250
        handoffGraceMs: 250
        timeoutMs: 2000
        disposeGraceMs: 500
    - id: tool-terminal
      name: '@hy/dsh-tool-terminal'
