# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`hy --profile headless "<task>"`), Session identity, permission and output
# options, and this app's --help, then the direct driver creates a fresh Agent, or adopts
# the exact Session the flag names, through the core registry and prints its
# durable result.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- insert:
    - id: headless-startup
      name: '@hy/dsh-headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@hy/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json

# Replacing config retains the base mode/root defaults while adding the CLI grants.
- id: sandbox-policy
  inject: [headlessStartup]
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
    additionalWritableRoots: !!js ctx.headlessStartup.additionalWritableRoots

# The approval default has to move with the sandbox default above.  Base pairs
# danger-full-access with `never`; leaving that here while the sandbox composes
# workspace-write produces a (sandbox, approval) pair no preset matches, and
# @hy/dsh-permission-presets then refuses to boot without an explicit
# defaultPreset.  One-shot jobs headline as workspace-write, so they ask.
- id: approval
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

- id: hmr
  disabled: true

# One-shot jobs use launch-time credentials instead of the interactive store.
- id: credentials
  disabled: true

- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true
